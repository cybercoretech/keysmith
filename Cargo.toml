[package]
name = "keysmith"
version = "0.1.0"
edition = "2021"
description = "Password, passphrase, and hash generator"

[lib]
name = "keysmith"
path = "src/lib.rs"

[[bin]]
name = "keysmith"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Everything the command-line tool needs. Library users (the CyberVault
# Android app, other integrations) build with default-features = false and
# get only the generators: rand + the embedded wordlist.
cli = ["dep:clap", "dep:rpassword", "dep:cybercore", "dep:blake3", "dep:argon2", "dep:password-hash"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
rand = "0.8"
sha2 = "0.10"
blake3 = { version = "1", optional = true }
argon2 = { version = "0.5", optional = true }
password-hash = { version = "0.5", features = ["rand_core"], optional = true }
rpassword = { version = "7", optional = true }
cybercore = { version = "0.4", optional = true }
